# main に push されたら、安全検査を通したうえで app/ の中身だけを GitHub Pages に公開する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定では読み取りだけ。公開に必要な権限は deploy ジョブにだけ与える。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 外部のアクションは、タグではなくコミットの SHA で固定する(あとから中身を差し替えられないように)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安全検査 (危険な書き方・外部 URL・設定の抜け・sw.js の更新漏れ)
        run: python3 tools/check.py
      - name: 公開する中身を用意する
        run: |
          mkdir _site
          cp -R app/. _site/
          # _headers は Cloudflare Pages / Netlify 用の設定ファイル。GitHub Pages では使われないので公開しない。
          rm -f _site/_headers
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
